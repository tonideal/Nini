<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Nini ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(270deg, #ff758c, #ff7eb3, #ffb199);
    background-size: 600% 600%;
    animation: gradientMove 15s ease infinite;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

h1 {
    font-size: 3em;
    margin-bottom: 20px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
}

p {
    font-size: 1.3em;
    max-width: 600px;
    margin-bottom: 30px;
}

img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
    margin-bottom: 30px;
    box-shadow: 0 0 30px rgba(255,255,255,0.6);
}

/* CONTENEDOR DE BOTONES */
.buttons {
    margin-top: 20px;
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
}

button {
    padding: 15px 35px;
    font-size: 1.1em;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background-color: white;
    color: #ff4b6e;
    font-weight: bold;
}

#yesBtn:hover {
    transform: scale(1.15);
}

#noBtn {
    background-color: rgba(255,255,255,0.7);
    position: relative;
}

#finalMessage {
    font-size: 2em;
    margin-top: 30px;
    display: none;
    animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
}

/* Corazones flotando */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(100vh);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- 🎵 Música -->
<audio id="bgMusic" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- 🖼️ Cambia esta imagen -->
<img src="foto.jpg" alt="Nini y yo">

<h1>Nini ✨💖</h1>

<p>
Desde que llegaste a mi vida todo es más bonito, más dulce, más especial.  
Tu sonrisa ilumina mis días y tu voz es mi lugar favorito.  
No quiero un 14 de febrero cualquiera…  
Quiero que seas mi San Valentín. 💘
</p>

<div class="buttons">
    <button id="yesBtn">Sí, quiero 💕</button>
    <button id="noBtn">No 😢</button>
</div>

<div id="finalMessage">
    Sabía que dirías que sí 😍  
    Te amo muchísimo, Nini ❤️
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const finalMessage = document.getElementById("finalMessage");
const music = document.getElementById("bgMusic");

/* 🎵 Música inicia en el primer click */
function startMusic() {
    music.play();
    document.removeEventListener("click", startMusic);
}
document.addEventListener("click", startMusic);

/* Botón NO empieza normal y luego huye */
noBtn.addEventListener("mouseover", () => {
    noBtn.style.position = "absolute";
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

/* Cuando dice SÍ */
yesBtn.addEventListener("click", () => {
    finalMessage.style.display = "block";
    createHeartsExplosion();
});

/* Corazones flotando constantes */
function createFloatingHearts() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createFloatingHearts, 300);

/* Explosión romántica */
function createHeartsExplosion() {
    for (let i = 0; i < 30; i++) {
        createFloatingHearts();
    }
}
</script>

</body>
</html>
